name: Snap

# Builds the snap on every push to main, so a broken package shows up right away; the built
# snap is kept as a download for testing. A version tag (v1.2.3) also publishes it to the
# Snap Store, using the repository secret SNAPCRAFT_STORE_CREDENTIALS.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: snapcore/action-build@v1
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: tileminal-snap
          path: ${{ steps.build.outputs.snap }}
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable
