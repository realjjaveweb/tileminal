name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install black isort flake8 mypy pytest
      - run: black --check .
      - run: isort --check-only .
      - run: flake8 src tests tools tileminal
      - run: mypy
      - name: Translation template is up to date
        run: python tools/update_pot.py --check

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - run: pytest tests --ignore=tests/ui

  # The real app on a headless GTK display, with the GTK and VTE that the distribution ships
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-vte-2.91 \
            libgtk-3-bin dbus python3-pytest python3-pytest-xdist
      - run: /usr/bin/python3 -m pytest tests/ui -v -n auto
      - run: python3 tileminal --help
